name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv sync --locked

      - run: uv run playwright install --with-deps chromium

      - run: uv run ruff format --check .

      - run: uv run ruff check .

      - run: uv run pytest
